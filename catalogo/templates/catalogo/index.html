<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Juegos de Mesa</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; }
        h1 { text-align: center; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .card a { text-decoration: none; color: inherit; }
        .card a:hover h3 { color: #3498db; }
        .card img { max-width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
        .precio { color: #27ae60; font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>

    <h1>🎲 Catálogo de Juegos de Mesa</h1>

    <div class="grid">
        {% for juego in juegos %}
            <div class="card">
                <a href="{% url 'catalogo:detalle_juego' juego.pk %}">
                    {% if juego.imagen %}
                        <img src="{{ juego.imagen.url }}" alt="{{ juego.nombre }}">
                    {% else %}
                        <img src="https://via.placeholder.com/200x180?text=Sin+Imagen" alt="Sin imagen">
                    {% endif %}
                    <h3>{{ juego.nombre }}</h3>
                </a>
                <p>Categoría: <strong>{{ juego.categoria.nombre }}</strong></p>
                <p class="precio">$ {{ juego.precio }}</p>
                <p>Stock: {{ juego.stock }} un.</p>
            </div>
        {% empty %}
            <p style="grid-column: 1/-1; text-align: center;">No hay juegos disponibles en este momento.</p>
        {% endfor %}
    </div>

</body>
</html>
